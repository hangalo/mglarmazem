<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <link rel="stylesheet" href="../resources/css/cssLayout.css" type="text/css"/>

    <body>

        <ui:composition template="./../WEB-INF/templates/template_estoque.xhtml">
            <ui:define name="content">

                <h:form id="frmTabela">
                    <p:growl id="msgs" showDetail="true" />

                    <p:panel style="max-width:1000px; margin:20px 0 20px 0; border: 1px solid #e0e0e0; border-radius: 4px; box-shadow: none;">
                        <div style="text-align: left; padding: 10px 0 20px 10px;">
                            <h2 style="font-weight: 500; color: #212529; font-size: 1.5rem; margin: 0;">Quantidade Existente por Sector</h2>
                        </div>

                        <p:dataTable id="tabelaStockSectores" value="#{produtoBean.listaStockPorSector}" var="stock" 
                                     sortBy="#{stock.sector.descricaoSector}"
                                     styleClass="ui-datatable-striped" 
                                     style="margin-top:10px; border: none;"
                                     emptyMessage="Nenhum registo de distribuição encontrado para os sectores.">

                            <p:headerRow field="sector.descricaoSector">
                                <p:column colspan="2" style="background-color: #f8f9fa; padding: 14px 16px; border-bottom: 1px solid #dee2e6; text-align: left;">
                                    <h:outputText value="Sector: " style="font-weight: bold; color: #495057; font-size: 1rem;"/>
                                    <h:outputText value="#{stock.sector.descricaoSector}" style="font-weight: bold; color: #495057; font-size: 1rem;"/>
                                </p:column>
                            </p:headerRow>

                            <p:column headerText="Nome do produto" style="text-align: left; padding: 14px 16px; border: none; color: #495057;">
                                <h:outputText value="#{stock.idProduto.descricaoProduto}" />
                            </p:column>

                            <p:column headerText="Em stock" style="width: 250px; text-align: left; padding: 14px 16px; border: none; color: #495057;">
                                <h:outputText value="#{stock.quantidadeSaidaArmazem}" style="font-weight: 400;" />
                                <h:outputText value=" #{stock.unidadeMedida}" style="font-size: 0.9em; color: #6c757d; margin-left: 4px;" />
                            </p:column>

                        </p:dataTable>
                    </p:panel>

                </h:form>
            </ui:define>
        </ui:composition>
    </body>
</html>
