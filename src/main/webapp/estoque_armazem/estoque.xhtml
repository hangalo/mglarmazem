<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <body>

        <ui:composition template="/WEB-INF/templates/template_estoque.xhtml">
            <ui:define name="content">

                <h:form id="frmTabela">
                    <p:growl id="msgs" showDetail="true" />

                    <p:panel style="max-width:1000px; margin:20px 0 20px 0;
                                    border:1px solid #e0e0e0; border-radius:4px; box-shadow:none;">

                        <div style="text-align:left; padding:10px 0 20px 10px;">
                            <h2 style="font-weight:500; color:#212529; font-size:1.5rem; margin:0;">
                                Quantidade Existente em Stock
                            </h2>
                        </div>

                        <p:panelGrid columns="3" layout="grid"
                                     styleClass="ui-panelgrid-blank"
                                     style="margin-bottom:15px;">

                            <p:outputLabel for="filtroCategoria" value="Categoria:" />
                            <p:selectOneMenu id="filtroCategoria"
                                             value="#{produtoBean.filtroIdCategoria}"
                                             style="width:250px;">
                                <f:selectItem itemLabel="-- Todas --" itemValue="#{null}" />
                                <f:selectItems value="#{produtoBean.listaCategorias}"
                                               var="cat"
                                               itemLabel="#{cat.descricaoCategoria}"
                                               itemValue="#{cat.idCategoria}" />
                            </p:selectOneMenu>
                            <p:spacer width="10" />

                            <p:outputLabel for="filtroProduto" value="Produto:" />
                            <p:inputText id="filtroProduto"
                                         value="#{produtoBean.filtroDescricaoProduto}"
                                         placeholder="Nome do produto..."
                                         style="width:250px;" />
                            <p:spacer width="10" />

                            <p:spacer width="10" />
                            <p:commandButton value="Filtrar"
                                             icon="pi pi-search"
                                             action="#{produtoBean.filtrar}"
                                             update="tabelaQuantidadeExistente msgs"
                                             style="margin-right:8px;" />
                            <p:commandButton value="Limpar"
                                             icon="pi pi-times"
                                             action="#{produtoBean.limparFiltros}"
                                             update="frmTabela"
                                             styleClass="ui-button-secondary" />
                        </p:panelGrid>

                        <p:dataTable id="tabelaQuantidadeExistente"
                                     value="#{produtoBean.listaQuantidadeExistente}"
                                     var="prod"
                                     sortBy="#{prod.descricaoProduto}"
                                     styleClass="ui-datatable-striped"
                                     style="margin-top:10px; border:none;"
                                     emptyMessage="Nenhum produto em stock.">

                            <p:column headerText="Nome do produto"
                                      sortBy="#{prod.descricaoProduto}"
                                      style="text-align:left; padding:14px 16px; color:#495057;">
                                <h:outputText value="#{prod.descricaoProduto}" />
                            </p:column>

                            <p:column headerText="Categoria"
                                      sortBy="#{prod.categoriaProduto.descricaoCategoria}"
                                      style="width:250px; text-align:left; padding:14px 16px; color:#495057;">
                                <h:outputText value="#{prod.categoriaProduto.descricaoCategoria}" />
                            </p:column>

                            <p:column headerText="Quantidade em stock"
                                      sortBy="#{prod.quantidadeExistente}"
                                      style="width:200px; text-align:left; padding:14px 16px; color:#495057;">
                                <h:outputText value="#{prod.quantidadeExistente}" style="font-weight:400;" />
                            </p:column>

                        </p:dataTable>
                    </p:panel>
                </h:form>

            </ui:define>
        </ui:composition>

    </body>
</html>
