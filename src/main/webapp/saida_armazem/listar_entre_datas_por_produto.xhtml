<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">

    <body>

        <ui:composition template="./../WEB-INF/templates/template_saida_armazem.xhtml">

            <ui:define name="content">
                <p:messages id="msgs" closable="true"/>

                <h:form id="frmDatas">

                    <p:panel header="Pesquisa de Saídas entre Datas" style="max-width:1100px; margin:auto 0 20px 0;">
                        <h:panelGrid columns="4" cellpadding="10" style="width:100%;">

                            <h:outputLabel value="Data Início:" for="dtInicio"/>
                            <p:datePicker id="dtInicio"
                                          value="#{saidaArmazemBean.dataInicio}"
                                          pattern="dd/MM/yyyy"
                                          showIcon="true"
                                          required="true"
                                          requiredMessage="Seleccione a data início"
                                          maxdate="#{saidaArmazemBean.hoje}"/>

                            <h:outputLabel value="Data Fim:" for="dtFim"/>
                            <p:datePicker id="dtFim"
                                          value="#{saidaArmazemBean.dataFim}"
                                          pattern="dd/MM/yyyy"
                                          showIcon="true"
                                          required="true"
                                          requiredMessage="Seleccione a data fim"
                                          maxdate="#{saidaArmazemBean.hoje}"/>

                        </h:panelGrid>

                        <p:separator/>

                        <div style="margin-top:10px; display:flex; gap:10px;">
                            <p:commandButton value="Pesquisar"
                                             action="#{saidaArmazemBean.pesquisarPorDatas}"
                                             update="frmDatas :msgs"
                                             icon="pi pi-search"
                                             styleClass="ui-button-info"/>

                            <p:commandButton value="Limpar"
                                             action="#{saidaArmazemBean.limparFiltros}"
                                             update="frmDatas :msgs"
                                             icon="pi pi-times"
                                             styleClass="ui-button-secondary"
                                             immediate="true">
                                <p:resetInput target="frmDatas"/>
                            </p:commandButton>
                        </div>
                    </p:panel>

                    <p:panel>

                        <p:toolbar style="margin-bottom:10px;">
                            <p:toolbarGroup align="left">
                                <h:outputText value="Total de registos: "
                                              style="font-weight:bold; margin-right:5px;"/>
                                <h:outputText value="#{saidaArmazemBean.listaSaidas.size()}"/>
                            </p:toolbarGroup>
                            <p:toolbarGroup align="right">
                                <h:outputText value="Quantidade total: "
                                              style="font-weight:bold; margin-right:5px;"/>
                                <h:outputText value="#{saidaArmazemBean.totalQuantidade}"/>
                            </p:toolbarGroup>
                        </p:toolbar>

                        <p:dataTable id="tblDatas"
                                     value="#{saidaArmazemBean.listaSaidas}"
                                     var="a"
                                     paginator="true"
                                     rows="10"
                                     paginatorPosition="bottom"
                                     paginatorAlwaysVisible="#{saidaArmazemBean.listaSaidas.size() gt 10}"
                                     emptyMessage="Nenhuma saída encontrada no período."
                                     styleClass="ui-datatable-striped"
                                     sortMode="multiple"
                                     style="width:100%;">

                            <p:column headerText="Descrição do Produto" sortBy="#{a.idProduto.descricaoProduto}">
                                <h:outputText value="#{a.idProduto.descricaoProduto}"/>
                            </p:column>

                            <p:column headerText="Sector de Destino" sortBy="#{a.sector.descricaoSector}">
                                <h:outputText value="#{a.sector.descricaoSector}"/>
                            </p:column>

                            <p:column headerText="Qtd" sortBy="#{a.quantidadeSaidaArmazem}" style="width:80px; text-align:center;">
                                <h:outputText value="#{a.quantidadeSaidaArmazem}"/>
                            </p:column>

                            <p:column headerText="Unidade" sortBy="#{a.unidadeMedida}" style="width:150px; text-align:center;">
                                <h:outputText value="#{a.unidadeMedida}"/>
                            </p:column>

                            <p:column headerText="Data da Saída" sortBy="#{a.dataSaidaArmazem}" style="text-align:center;">
                                <h:outputText value="#{a.dataSaidaArmazem}">
                                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                                </h:outputText>
                            </p:column>

                        </p:dataTable>
                    </p:panel>

                </h:form>
            </ui:define>

        </ui:composition>

    </body>
</html>
