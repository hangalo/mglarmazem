<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="jakarta.faces.html">

    <body>

        <ui:composition template="./../WEB-INF/templates/template_administracao.xhtml">

            <ui:define name="top">
               Lista dos Produtos
            </ui:define>

            <ui:define name="bottom">
                <p:dataTable id="tabelaProdutos" value="#{produtoBean.listaProdutos}" var="p" 
                             paginator="true" rows="5" stripedRows="true" style="margin-top:20px;"
                             emptyMessage="Nenhum produto encontrado.">

                    <p:column headerText="ID" width="50">
                        <h:outputText value="#{p.idProduto}" />
                    </p:column>

                    <p:column headerText="Descrição">
                        <h:outputText value="#{p.descricaoProduto}" />
                    </p:column>

                    <p:column headerText="Categoria">
                        <h:outputText value="#{p.categoria}" />
                    </p:column>

                    <p:column headerText="Ações" width="100" style="text-align: center">

                        <p:commandButton icon="pi pi-pencil" 
                                         action="#{produtoBean.prepararEditar(p)}" 
                                         update=":frmProduto" 
                                         process="@this" 
                                         styleClass="ui-button-flat ui-button-warning" 
                                         title="Editar Produto"/>

                        <p:commandButton icon="pi pi-trash" 
                                         action="#{produtoBean.eliminar(p.idProduto)}" 
                                         update="tabelaProdutos :frmProduto:msgs" 
                                         styleClass="ui-button-flat ui-button-danger"
                                         title="Eliminar Produto">
                            <p:confirm header="Confirmação" message="Deseja eliminar este produto?" icon="pi pi-info-circle" />
                        </p:commandButton>

                    </p:column>
                </p:dataTable>

                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
                    <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                    <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" />
                </p:confirmDialog>

            </ui:define>

        </ui:composition>

    </body>
</html>
