<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">

    <body>

        <ui:composition template="./../WEB-INF/templates/template_estoque.xhtml">
            <ui:define name="content">
                <h:form id="formEstoque">
                    <p:growl id="msges" showDetail="true" skipDetailIfEqualsSummary="true" />

                    <p:panel header=" Análise de Estoque" style="margin-bottom:20px">
                        <h:panelGrid columns="7" cellpadding="5">

                            <div style="display: flex; align-items: center; gap: 8px;">
                                <h:outputLabel value="Sector:" style="color: #495057; font-size: 0.95em; white-space: nowrap;"/>
                                <p:selectOneMenu id="sector"
                                                 value="#{saidaArmazemBean.saida.sector}"
                                                 required="true"
                                                 converter="omnifaces.SelectItemsConverter"
                                                 requiredMessage="Seleccione o sector">
                                    <f:selectItem itemLabel="Selecione o Sector" itemValue="#{null}" noSelectionOption="true"/>
                                    <f:selectItems value="#{saidaArmazemBean.listaSectores}"
                                                   var="sec"
                                                   itemValue="#{sec}"
                                                   itemLabel="#{sec.descricaoSector}"/>
                                </p:selectOneMenu>
                            </div>

                            <p:outputLabel for="dataIni" value="Data Início:" />
                            <p:datePicker id="dataIni" value="#{estoqueBean.dataInicio}" pattern="yyyy-MM-dd HH:mm:ss" showIcon="true" required="true" />

                            <p:outputLabel for="dataFim" value="Data Fim:" />
                            <p:datePicker id="dataFim" value="#{estoqueBean.dataFim}" pattern="yyyy-MM-dd HH:mm:ss" showIcon="true" required="true" />

                            <h:panelGroup>
                                <p:commandButton value="Pesquisar" action="#{estoqueBean.pesquisarEstoque()}" 
                                                 update="tabelaEstoque msges" icon="pi pi-search" styleClass="ui-button-success" />
                                <p:commandButton value="Limpar" action="#{estoqueBean.limparFiltros()}" 
                                                 update="formEstoque" icon="pi pi-refresh" styleClass="ui-button-secondary" style="margin-left: 10px;" />
                            </h:panelGroup>

                        </h:panelGrid>
                    </p:panel>

                    <p:dataTable id="tabelaEstoque" value="#{s}" var="est"
                                 emptyMessage="Nenhum registro de estoque encontrado para os filtros aplicados."
                                 paginator="true" rows="10" paginatorPosition="bottom"
                                 rowsPerPageTemplate="5,10,20"
                                 stripedRows="true" showGridlines="true">

                        <f:facet name="header">
                            <h2>  Movimentações do Período vs.  Estoque Atual </h2>
                        </f:facet>

                        <p:column headerText="Sector de Destino" style="text-align:left;">
                            <h:outputText value="#{s.sector.descricaoSector}"/>
                        </p:column>

                        <p:column headerText="Descrição do Produto" sortBy="#{a.produto.descricaoProduto}" style="width:400px; text-align:left;">
                            <h:outputText value="#{a.produto.descricaoProduto}"/>
                        </p:column>

                        <p:column headerText="Total Entradas" style="text-align: center; color: #2e7d32; font-weight: bold;">
                            <h:outputText value="#{est.totalEntradas}" />
                        </p:column>
                        <p:column headerText="Total Saídas" sortBy="#{a.quantidadeProduto}" style="width:200px; text-align:center;">
                            <h:outputText value="#{a.quantidadeProduto}" style="font-weight:bold;"/>
                        </p:column>

                        <p:column headerText="Qtd Existente (Físico)" style="text-align: center; background-color: #f5f5f5; font-weight: bold;">
                            <h:outputText value="#{p.quantidadeExistente}" 
                                          styleClass="#{p.quantidadeExistente &lt;= 5 ? 'text-danger font-bold' : ''}" />
                        </p:column>

                    </p:dataTable>
                </h:form>
            </ui:define>



        </ui:composition>

    </body>
</html>
