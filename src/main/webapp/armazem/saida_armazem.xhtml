<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
    <body>
        <ui:composition template="./../WEB-INF/templates/template_administracao.xhtml">
            <ui:define name="content">
                <h:form id="frmSaida">

                    <p:growl id="msgs" showDetail="true" life="4000"/>

                    <p:panel header="Registo de Saída de Armazém" style="max-width:680px; margin:auto 0 20px 0;">
                        <h:panelGrid columns="2" cellpadding="10" style="width:100%;">

                            <h:outputLabel value="Produto:" for="produto"/>
                            <p:selectOneMenu id="produto"
                                             value="#{saidaArmazemBean.saida.idProduto}"
                                             required="true"
                                             requiredMessage="Informe o produto">
                                <f:selectItem itemLabel="Selecione um Produto" itemValue=""/>
                                <f:selectItems value="#{produtoBean.listaProdutos}" 
                                               var="p" 
                                               itemValue="#{p.idProduto}" 
                                               itemLabel="#{p.descricaoProduto}"/>
                            </p:selectOneMenu>
                            <h:outputLabel value="Sector de Destino:" for="sector"/>
                            <p:selectOneMenu id="Sector"
                                             value="#{saidaArmazemBean.saida.idSector}"
                                             required="true"
                                             converter="omnifaces.SelectItemsConverter" requiredMessage="Informe o Sector">
                                <f:selectItem itemLabel="Selecione o Sector" />
                                <f:selectItems value="#{sectorBean.listaSectores}"  var="s"  itemValue="#{s.idSector}" itemLabel="#{s.descricaoSector}"/>
                            </p:selectOneMenu>

                            <h:outputLabel value="Quantidade a Sair:" for="qtd"/>
                            <p:inputText id="qtd"
                                         value="#{saidaArmazemBean.saida.quantidadeSaidaArmazem}"
                                         required="true"
                                         requiredMessage="Informe a quantidade">
                                <f:convertNumber integerOnly="true"/>
                            </p:inputText>

                            <h:outputLabel value="Data de Saída:" for="dataSaida"/>
                            <p:datePicker id="dataSaida"
                                          value="#{saidaArmazemBean.saida.dataSaidaArmazem}"
                                          pattern="dd/MM/yyyy"
                                          showIcon="true"
                                          required="true"
                                          requiredMessage="Informe a data de saída"/>

                        </h:panelGrid>

                        <p:separator/>

                        <div style="text-align:center; margin-top:15px;">
                            <p:commandButton value="Registar Saída"
                                             action="#{saidaArmazemBean.registrar}"
                                             update="frmSaida"
                                             icon="pi pi-check"
                                             styleClass="ui-button-success"
                                             style="margin-right:10px;"/>

                            <p:commandButton value="Limpar"
                                             action="#{saidaArmazemBean.limpar}"
                                             update="frmSaida"
                                             icon="pi pi-refresh"
                                             styleClass="ui-button-secondary"
                                             immediate="true"/>
                        </div>
                    </p:panel>
                </h:form>
            </ui:define>
        </ui:composition>
    </body>
</html>
