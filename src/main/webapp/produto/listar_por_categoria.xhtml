<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">

    <body>

        <ui:composition template="./../WEB-INF/templates/template_administracao.xhtml">

            <f:metadata>
                <f:viewAction action="#{produtoBean.limparParaPesquisa}" />
            </f:metadata>

            <ui:define name="content">

                <h:form id="frmProduto">
                    <p:growl id="msgs" showDetail="true" />

                    <p:panel header="Pesquisa Por Categoria" style="max-width:1000px; margin:auto 0 20px 0;">
                        <h:panelGrid columns="1" cellpadding="10" style="width:60%;">
                            <h:outputLabel value="" for="categoria"/>

                            <p:selectOneMenu id="categoria"
                                             value="#{produtoBean.filtroIdCategoria}">
                                <f:selectItem itemLabel="Selecione a Categoria" itemValue=""/>
                                <f:selectItems value="#{categoriaBean.listaCategorias}" 
                                               var="cat" 
                                               itemLabel="#{cat.descricaoCategoria}" 
                                               itemValue="#{cat.idCategoria}" />
                            </p:selectOneMenu>

                            <h:panelGroup>
                                <p:commandButton value="Pesquisar" 
                                                 action="#{produtoBean.pesquisarPorCategoria()}" 
                                                 update="tabelaProdutos msgs" 
                                                 icon="pi pi-search" 
                                                 styleClass="ui-button-info" 
                                                 style="margin-right: 10px"/>

                                <p:commandButton value="Ver Todos" 
                                                 action="#{produtoBean.listar}" 
                                                 update="tabelaProdutos categoria" 
                                                 icon="pi pi-list" 
                                                 styleClass="ui-button-secondary" 
                                                 style="margin-right: 10px"/>

                            </h:panelGroup>
                        </h:panelGrid>
                    </p:panel>

                    <p:dataTable id="tabelaProdutos" 
                                 value="#{produtoBean.listaProdutos}" 
                                 var="p" 
                                 paginator="true" 
                                 rows="10" 
                                 paginatorPosition="bottom"
                                 paginatorAlwaysVisible="false"
                                 emptyMessage="Nenhum produto encontrado."
                                 stripedRows="true">

                        <p:column headerText="Código" width="15%" style="text-align: center">
                            <h:outputText value="#{p.idProduto}" />
                        </p:column>

                        <p:column headerText="Descrição do Produto" width="15%" style="text-align: center">
                            <h:outputText value="#{p.descricaoProduto}" />
                        </p:column>

                        <p:column headerText="Codigo da Categoria" width="15%" style="text-align: center">
                            <h:outputText value="#{p.categoriaProduto.idCategoria}" />
                        </p:column>

                        <p:column headerText="Estoque Atual" width="15%" style="text-align: center">
                            <h:outputText value="#{p.quantidadeExistente}" 
                                          styleClass="#{p.quantidadeExistente le 5 ? 'text-danger font-bold' : ''}" />
                        </p:column>

                    </p:dataTable>

                </h:form>
            </ui:define>

        </ui:composition>

    </body>
</html>
