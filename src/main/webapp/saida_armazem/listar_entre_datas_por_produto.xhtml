<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">

    <body>

        <ui:composition template="./../WEB-INF/templates/template_saida_armazem.xhtml">

            <ui:define name="content">
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding: 20px; box-sizing: border-box;">

                    <p:messages id="msgs" closable="true" style="width: 100%; max-width: 1000px;"/>

                    <h:form id="frmDatas" style="width: 100%; max-width: 1000px;">

                        <p:panel header="Saídas por Produto" style="max-width:1000px; margin: 0 auto 30px auto;">
                            <h:panelGrid columns="4" cellpadding="10" style="width:100%;">

                                <h:outputLabel value="Data Início:" for="dtInicio"/>
                                <p:datePicker id="dtInicio"
                                              value="#{saidaArmazemBean.dataInicio}"
                                              pattern="dd/MM/yyyy"
                                              showIcon="true"
                                              required="true"
                                              requiredMessage="Seleccione a data início"
                                              maxdate="#{saidaArmazemBean.hoje}"/>

                                <h:outputLabel value="Data Fim:" for="dtFim"/>
                                <p:datePicker id="dtFim"
                                              value="#{saidaArmazemBean.dataFim}"
                                              pattern="dd/MM/yyyy"
                                              showIcon="true"
                                              required="true"
                                              requiredMessage="Seleccione a data fim"
                                              maxdate="#{saidaArmazemBean.hoje}"/>

                            </h:panelGrid>

                            <p:separator/>

                            <div style="margin-top:10px; display:flex; gap:10px;">
                                <p:commandButton value="Pesquisar por Produto"
                                                 action="#{saidaArmazemBean.pesquisarSaidasProduto}"
                                                 update="frmDatas :msgs"
                                                 icon="pi pi-search"
                                                 styleClass="ui-button-info"/>

                                <p:commandButton value="Limpar"
                                                 action="#{saidaArmazemBean.limparFiltros}"
                                                 update="frmDatas :msgs"
                                                 icon="pi pi-times"
                                                 styleClass="ui-button-secondary"
                                                 immediate="true"/>
                            </div>
                        </p:panel>

                        <p:panel style="max-width:1000px; margin: 0 auto;">

                            <p:dataTable id="tblDatas"
                                         value="#{saidaArmazemBean.listaSaidasPorProduto}"
                                         var="a"
                                         paginator="true"
                                         rows="10"
                                         paginatorPosition="bottom"
                                         paginatorAlwaysVisible="#{saidaArmazemBean.listaSaidasPorProduto.size() gt 10}"
                                         emptyMessage="Nenhum registo de saída encontrado no período."
                                         styleClass="ui-datatable-striped"
                                         sortMode="multiple"
                                         style="width:100%;">


                                <p:column headerText="Descrição do Produto" sortBy="#{a.produto.descricaoProduto}" style="width:400px; text-align:left;">
                                    <h:outputText value="#{a.produto.descricaoProduto}"/>
                                </p:column>

                                <p:column headerText="Quantidade Acumulada" sortBy="#{a.quantidadeProduto}" style="width:200px; text-align:center;">
                                    <h:outputText value="#{a.quantidadeProduto}" style="font-weight:bold;"/>
                                </p:column>

                                <p:column headerText="Unidade" style="width:80px; text-align:center;">
                                    <h:outputText value="#{s.unidadeMedida}"/>
                                </p:column>



                            </p:dataTable>
                        </p:panel>

                    </h:form>
                </div>
            </ui:define>

        </ui:composition>

    </body>
</html>
