<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">

    <body>

        <ui:composition template="./../WEB-INF/templates/template_administracao.xhtml">
<ui:define name="content">
           <h:form id="frmTabela">
                    <p:panel header="Histórico  Movimentos de Saída" style="max-width:1100px; margin:0 auto;">
                        
                        <p:dataTable id="tblSaidas" 
                                     value="#{saidaArmazemBean.listaSaidas}" 
                                     var="s" 
                                     paginator="true" 
                                     rows="10" 
                                     paginatorPosition="bottom"
                                     paginatorAlwaysVisible="#{saidaArmazemBean.listaSaidas.size() gt 10}"
                                     emptyMessage="Nenhum registo de saída encontrado no sistema."
                                     styleClass="ui-datatable-striped"
                                     style="width:100%;">

                            <p:column headerText="Nº Operação" style="width:120px; text-align:center;">
                                <h:outputText value="#{s.idSaidaArmazem}"/>
                            </p:column>

                            <p:column headerText="Código do Produto" style="width:150px; text-align:center;">
                                <h:outputText value="#{s.idProduto}"/>
                            </p:column>

                            <p:column headerText="Código do Sector" style="width:150px; text-align:center;">
                                <h:outputText value="#{s.idSector}"/>
                            </p:column>

                            <p:column headerText="Qtd. Retirada" style="width:150px; text-align:center;">
                                <h:outputText value="#{s.quantidadeSaidaArmazem}" style="font-weight:bold; color:#c0392b;"/>
                            </p:column>

                            <p:column headerText="Data e Hora do Movimento" style="text-align:center;">
                                <h:outputText value="#{s.dataSaidaArmazem}">
                                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                                </h:outputText>
                            </p:column>

                        </p:dataTable>
                    </p:panel>
                </h:form>
            </ui:define>


        </ui:composition>

    </body>
</html>
